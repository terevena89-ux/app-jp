<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JP</title>
  <meta name="description" content="Ma bibliothèque de jurisprudences.">
  <meta name="theme-color" content="#f5f5f7">
  <script>
    // Thème appliqué avant l'affichage (pas de flash blanc). Auto = suit le PC / tel.
    (function () {
      var r = {};
      try { r = JSON.parse(localStorage.getItem("jp-reglages")) || {}; } catch (e) {}
      var choix = r.theme || "auto";
      var sombreTel = matchMedia("(prefers-color-scheme: dark)");
      function appliquer() {
        var theme = choix === "auto" ? (sombreTel.matches ? "sombre" : "clair") : choix;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "sombre" ? "#171c24" : "#f5f5f7";
      }
      appliquer();
      sombreTel.addEventListener("change", appliquer);
      window.appliquerTheme = function (nouveau) { choix = nouveau; appliquer(); };
      if (r.animations === "simples") document.documentElement.classList.add("anim-simples");
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ CONNEXION ============ -->
<section id="ecran-connexion" class="connexion" hidden>
  <img src="icones/icone.svg" alt="" width="72" height="72">
  <h1>JP</h1>
  <button id="btn-connexion" class="btn btn-accent" type="button">Se connecter avec Google</button>
  <p id="connexion-erreur" class="erreur" hidden></p>
</section>

<!-- ============ APPLI ============ -->
<div id="appli" class="appli" hidden>

  <!-- Barre de côté (PC) : sujets + filtres, façon Finder -->
  <aside class="cote" id="cote">
    <div class="cote-defile">
      <div class="cote-titre">Bibliothèque</div>
      <button class="cote-ligne" type="button" data-sujet="">Toutes les JP</button>
      <div class="cote-titre">Sujets</div>
      <div id="cote-sujets"></div>
      <div class="cote-titre">Juridictions</div>
      <div id="cote-jur"></div>
      <div class="cote-titre">Portée</div>
      <div id="cote-por"></div>
      <div class="cote-titre">Importance</div>
      <div id="cote-imp"></div>
    </div>
    <button class="cote-reglages" type="button" data-ouvrir="reglages">
      <svg class="ic"><use href="#i-reglages"></use></svg>Réglages
    </button>
  </aside>

  <main class="principal">
    <header class="outils">
      <h1 id="titre-vue">Toutes les JP</h1>
      <label class="cherche">
        <svg class="ic"><use href="#i-chercher"></use></svg>
        <input id="recherche" type="search" placeholder="Rechercher" aria-label="Rechercher">
      </label>
      <button class="btn btn-accent btn-nouvelle" type="button" data-ouvrir="nouvelle">
        <svg class="ic"><use href="#i-plus"></use></svg><span>Nouvelle JP</span>
      </button>
      <button class="btn-icone seul-tel" type="button" data-ouvrir="reglages" aria-label="Réglages">
        <svg class="ic"><use href="#i-reglages"></use></svg>
      </button>
    </header>

    <!-- Téléphone : sujets en puces + bouton Filtres -->
    <div class="puces seul-tel" id="puces-tel"></div>

    <section class="carte frise-carte">
      <div class="frise-noms" id="frise-noms"></div>
      <div class="frise-defile" id="frise"></div>
      <div class="legende">
        <div class="seg" id="seg-couleur" role="group" aria-label="Couleur selon">
          <button type="button" data-couleur="jur">Juridiction</button>
          <button type="button" data-couleur="por">Portée</button>
        </div>
        <div class="legende-cles" id="legende-cles"></div>
      </div>
    </section>

    <section class="liste" id="liste"></section>
  </main>
</div>

<!-- ============ PANNEAU : fiche / formulaire ============ -->
<div class="voile" id="voile-panneau" hidden></div>
<aside class="panneau" id="panneau" hidden></aside>

<!-- ============ FILTRES (téléphone) ============ -->
<div class="voile" id="voile-filtres" hidden></div>
<section class="tiroir" id="tiroir-filtres" hidden>
  <div class="tiroir-tete"><h2>Filtres</h2><button class="btn-texte" type="button" id="btn-filtres-zero">Tout effacer</button></div>
  <div class="tiroir-titre">Juridictions</div><div class="puces-cases" id="tir-jur"></div>
  <div class="tiroir-titre">Portée</div><div class="puces-cases" id="tir-por"></div>
  <div class="tiroir-titre">Importance</div><div class="puces-cases" id="tir-imp"></div>
</section>

<!-- ============ RÉGLAGES ============ -->
<section class="ecran-plein" id="ecran-reglages" hidden>
  <header class="plein-tete">
    <button class="btn-icone" type="button" data-fermer aria-label="Retour"><svg class="ic"><use href="#i-retour"></use></svg></button>
    <h2>Réglages</h2>
  </header>
  <div class="plein-corps">
    <div class="groupe">
      <button class="rangee" type="button" data-ouvrir="theme"><span>Thème</span><span class="valeur" id="val-theme"></span><svg class="ic chevron"><use href="#i-chevron"></use></svg></button>
      <div class="rangee"><span>Animations</span>
        <div class="seg" id="seg-anim" role="group" aria-label="Animations">
          <button type="button" data-anim="completes">Complètes</button>
          <button type="button" data-anim="simples">Simples</button>
        </div>
      </div>
    </div>
    <div class="groupe-titre">Excel</div>
    <div class="groupe">
      <div class="rangee rangee-boutons">
        <button class="btn" type="button" id="btn-export">Exporter</button>
        <button class="btn" type="button" id="btn-import">Importer</button>
        <input type="file" id="fichier-import" accept=".xlsx" hidden>
      </div>
    </div>
    <div class="groupe">
      <button class="rangee" type="button" data-ouvrir="notes"><span>Notes</span><svg class="ic chevron"><use href="#i-chevron"></use></svg></button>
    </div>
    <div class="groupe-titre">Compte</div>
    <div class="groupe">
      <div class="rangee"><span id="compte-info"></span></div>
      <div class="rangee"><span>Synchro</span><span class="synchro" id="synchro"><i></i><span></span></span></div>
      <div class="rangee"><span>Version</span><span class="valeur" id="version"></span></div>
      <button class="rangee rangee-danger" type="button" id="btn-deconnexion"><span>Se déconnecter</span></button>
    </div>
  </div>
</section>

<section class="ecran-plein" id="ecran-theme" hidden>
  <header class="plein-tete">
    <button class="btn-icone" type="button" data-fermer aria-label="Retour"><svg class="ic"><use href="#i-retour"></use></svg></button>
    <h2>Thème</h2>
  </header>
  <div class="plein-corps">
    <div class="groupe" id="choix-theme">
      <button class="rangee" type="button" data-theme-choix="auto"><span>Auto</span><svg class="ic coche"><use href="#i-coche"></use></svg></button>
      <button class="rangee" type="button" data-theme-choix="clair"><span>Clair</span><svg class="ic coche"><use href="#i-coche"></use></svg></button>
      <button class="rangee" type="button" data-theme-choix="sombre"><span>Sombre</span><svg class="ic coche"><use href="#i-coche"></use></svg></button>
    </div>
  </div>
</section>

<!-- Message « JP supprimée — Annuler » -->
<div class="toast" id="toast" hidden><span id="toast-texte"></span><button type="button" id="toast-btn"></button></div>

<!-- Icônes au trait fin -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chercher" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></symbol>
  <symbol id="i-reglages" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-fermer" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-plus-actions" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="i-lien" viewBox="0 0 24 24"><path d="M12 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6M11 13l9-9M15 4h5v5"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2zM9 13h6M9 17h4"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-retour" viewBox="0 0 24 24"><path d="M5 12h14M5 12l6 6M5 12l6-6"/></symbol>
  <symbol id="i-coche" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
  <symbol id="i-filtre" viewBox="0 0 24 24"><path d="M4 5h16M7 12h10M10 19h4"/></symbol>
</svg>

<script src="champs-mobile.js"></script>
<script src="notes-idees.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
